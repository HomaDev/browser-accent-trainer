<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pitch & Spectrogram Comparison (Standalone)</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #fbfbfd;
      padding-top: 30px;
      gap: 20px;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      width: 600px;
      border: 2px solid transparent;
      transition: border-color 0.15s, background-color 0.15s;
    }
    .card.drag-over-card {
      border-color: #4562a1;
      background: #f4f7fe;
    }
    .sidebar {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      width: 310px;
      height: 82vh;
      display: flex;
      flex-direction: column;
      border: 2px solid transparent;
      transition: border-color 0.15s, background-color 0.15s;
    }
    .sidebar.drag-over-root {
      border-color: #4562a1;
      background: #f4f7fe;
    }
    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      margin-bottom: 8px;
      border-bottom: 1px solid #eee;
      gap: 6px;
    }
    .sidebar-title {
      font-size: 14px;
      font-weight: 700;
      color: #333;
    }
    .sidebar-actions {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .mini-btn {
      padding: 5px 7px;
      font-size: 11px;
      border-radius: 5px;
      background: #4562a1;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      width: auto;
    }
    .mini-btn.secondary {
      background: #666;
    }
    .mini-btn.ghost {
      background: #eef1f6;
      color: #333;
    }
    .mini-btn:hover { opacity: 0.9; }

    .storage-banner {
      display: none;
      font-size: 11px;
      line-height: 1.4;
      background: #fff4e5;
      color: #8a4b08;
      border: 1px solid #ffd599;
      border-radius: 6px;
      padding: 7px 9px;
      margin-bottom: 8px;
    }
    .storage-banner.visible {
      display: block;
    }

    .tree-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-bottom: 40px;
    }
    .empty-hint {
      text-align: center;
      color: #999;
      font-size: 13px;
      margin-top: 40px;
      line-height: 1.5;
      pointer-events: none;
    }

    /* Folder & Audio Tree Rows */
    .tree-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 8px;
      border-radius: 6px;
      border: 1px solid #e6e6e6;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      color: #333;
      user-select: none;
      position: relative;
      transition: background 0.12s;
    }
    .tree-row:hover { background: #f5f5f7; }
    .folder-row {
      background: #f8f9fb;
      font-weight: 600;
      border-color: #dde2ec;
    }
    .audio-row.active {
      border-color: #4562a1;
      background: #eef2fb;
      font-weight: 600;
    }

    .inline-input {
      width: 100%;
      font-size: 13px;
      padding: 2px 5px;
      border: 1px solid #4562a1;
      border-radius: 4px;
      outline: none;
      font-family: inherit;
      box-sizing: border-box;
    }

    /* Drag & Drop Visual Indicators */
    .tree-row.drag-inside {
      background: #dce6fb !important;
      border: 1px dashed #4562a1 !important;
    }
    .tree-row.drag-before {
      border-top: 2px solid #4562a1 !important;
    }
    .tree-row.drag-after {
      border-bottom: 2px solid #4562a1 !important;
    }

    .row-left {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      flex: 1;
    }
    .row-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .caret {
      font-size: 10px;
      width: 12px;
      display: inline-block;
      text-align: center;
      color: #666;
    }
    .row-actions {
      display: none;
      align-items: center;
      gap: 3px;
      margin-left: 4px;
    }
    .tree-row:hover .row-actions {
      display: flex;
    }
    .icon-btn {
      background: #e9ecef;
      color: #444;
      border: none;
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 10px;
      cursor: pointer;
      width: auto;
      font-weight: 600;
    }
    .icon-btn:hover { background: #d0d5dd; }
    .icon-btn.del:hover { background: #e0245e; color: white; }

    /* Player Card Styling */
    .header-row {
      display: flex;
      align-items: center;
      position: relative;
      margin-bottom: 25px;
      min-height: 32px;
    }
    .speed-controls {
      position: absolute;
      left: 0;
      top: 0;
      display: flex;
      gap: 5px;
      z-index: 2;
    }
    .speed-btn {
      padding: 4px 8px;
      font-size: 12px;
      background: #eee;
      color: #555;
      border: 1px solid #ccc;
      cursor: pointer;
      border-radius: 4px;
      width: auto;
      font-weight: bold;
    }
    .speed-btn:hover { background: #e0e0e0; }
    .speed-btn.active {
      background: #4562a1;
      color: white;
      border-color: #4562a1;
    }
    .jp-text {
      width: 100%;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin: 0;
      padding: 0 110px;
      box-sizing: border-box;
      word-break: break-word;
    }

    .panel-row { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
    .btn-col { display: flex; flex-direction: column; gap: 8px; min-width: 90px; }

    .canvas-wrapper {
      width: 460px;
      overflow-x: auto;
      border-radius: 6px;
      background: #000;
    }
    .canvas-wrapper::-webkit-scrollbar { height: 8px; }
    .canvas-wrapper::-webkit-scrollbar-track { background: #333; border-radius: 4px; }
    .canvas-wrapper::-webkit-scrollbar-thumb { background: #666; border-radius: 4px; }
    .canvas-wrapper::-webkit-scrollbar-thumb:hover { background: #888; }

    canvas {
      display: block;
      cursor: crosshair;
    }

    button.main-btn { cursor: pointer; border: none; border-radius: 6px; padding: 10px 15px; font-weight: 600; color: white; width: 100%; box-sizing: border-box; }
    .btn-play { background: #4562a1; }
    .btn-play-user { background: #777; display: none; }
    .btn-record { background: #e0245e; }
    .btn-record.recording { background: #111; }

    .hint { font-size: 12px; color: #888; text-align: center; margin-top: -15px; margin-bottom: 20px; font-style: italic; }
  </style>
</head>
<body>

<div class="card" id="mainCard">
  <div class="header-row">
    <div class="speed-controls">
      <button class="speed-btn active" data-speed="1.0">1x</button>
      <button class="speed-btn" data-speed="0.5">0.5x</button>
      <button class="speed-btn" data-speed="0.25">0.25x</button>
    </div>
    <div id="jpDisplay" class="jp-text">Drop or select audio...</div>
  </div>

  <div class="hint">Scroll = Zoom In/Out | Shift + Scroll = Move Left/Right | Click Graph = Play</div>

  <!-- Reference Audio Row -->
  <div class="panel-row">
    <div class="btn-col">
      <button id="playNativeBtn" class="main-btn btn-play">▶ Native</button>
    </div>
    <div class="canvas-wrapper" id="nativeWrapper">
      <canvas id="nativeCanvas" width="460" height="180"></canvas>
    </div>
  </div>

  <!-- User Recording Row -->
  <div class="panel-row">
    <div class="btn-col">
      <button id="recordBtn" class="main-btn btn-record">● Record</button>
      <button id="playUserBtn" class="main-btn btn-play-user">▶ Play</button>
    </div>
    <div class="canvas-wrapper" id="userWrapper">
      <canvas id="userCanvas" width="460" height="180"></canvas>
    </div>
  </div>
</div>

<!-- Right Sidebar: Local Library -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">Audio Library</span>
    <div class="sidebar-actions">
      <button type="button" class="mini-btn" id="newRootFolderBtn">+ Folder</button>
      <button type="button" class="mini-btn secondary" id="uploadFilesBtn">+ Files</button>
      <button type="button" class="mini-btn ghost" id="exportBtn" title="Export Library Backup">Export</button>
      <button type="button" class="mini-btn ghost" id="importBtn" title="Import Library Backup">Import</button>
      <input type="file" id="fileInput" multiple accept="audio/*" style="display:none;">
      <input type="file" id="importInput" accept=".json,application/json" style="display:none;">
    </div>
  </div>
  <div class="storage-banner" id="storageBanner"></div>
  <div class="tree-container" id="treeContainer"></div>
</div>

<audio id="nativePlayer"></audio>
<audio id="userPlayer"></audio>

<script>
  const ANALYSIS_VERSION = 2;

  // ==========================================
  // 1. CLIENT-SIDE DSP: pYIN + VITERBI HMM & SPECTROGRAM
  // ==========================================
  const MAGMA_STOPS = [
    [0.00, [0, 0, 4]],
    [0.13, [28, 16, 68]],
    [0.25, [79, 18, 123]],
    [0.38, [129, 37, 129]],
    [0.50, [181, 54, 122]],
    [0.63, [229, 80, 100]],
    [0.75, [251, 135, 97]],
    [0.88, [254, 194, 135]],
    [1.00, [252, 253, 191]]
  ];

  const MAGMA_LUT = (() => {
    const lut = new Uint8Array(256 * 3);
    for (let i = 0; i < 256; i++) {
      const t = i / 255;
      let s0 = MAGMA_STOPS[0];
      let s1 = MAGMA_STOPS[MAGMA_STOPS.length - 1];
      for (let j = 0; j < MAGMA_STOPS.length - 1; j++) {
        if (t >= MAGMA_STOPS[j][0] && t <= MAGMA_STOPS[j + 1][0]) {
          s0 = MAGMA_STOPS[j];
          s1 = MAGMA_STOPS[j + 1];
          break;
        }
      }
      const span = s1[0] - s0[0] || 1;
      const frac = (t - s0[0]) / span;
      lut[i * 3]     = Math.round(s0[1][0] + frac * (s1[1][0] - s0[1][0]));
      lut[i * 3 + 1] = Math.round(s0[1][1] + frac * (s1[1][1] - s0[1][1]));
      lut[i * 3 + 2] = Math.round(s0[1][2] + frac * (s1[1][2] - s0[1][2]));
    }
    return lut;
  })();

  const fftCache = new Map();
  function getFFT(size) {
    if (fftCache.has(size)) return fftCache.get(size);

    const bits = Math.log2(size);
    const rev = new Uint32Array(size);
    for (let i = 0; i < size; i++) {
      let r = 0;
      for (let j = 0; j < bits; j++) {
        r = (r << 1) | ((i >> j) & 1);
      }
      rev[i] = r;
    }

    const cosTable = new Float32Array(size / 2);
    const sinTable = new Float32Array(size / 2);
    for (let i = 0; i < size / 2; i++) {
      const angle = (-2 * Math.PI * i) / size;
      cosTable[i] = Math.cos(angle);
      sinTable[i] = Math.sin(angle);
    }

    const hann = new Float32Array(size);
    for (let i = 0; i < size; i++) {
      hann[i] = 0.5 * (1 - Math.cos((2 * Math.PI * i) / (size - 1)));
    }

    const fn = {
      hann,
      transform(real, imag) {
        for (let i = 0; i < size; i++) {
          const j = rev[i];
          if (i < j) {
            const tr = real[i]; real[i] = real[j]; real[j] = tr;
            const ti = imag[i]; imag[i] = imag[j]; imag[j] = ti;
          }
        }
        for (let len = 2; len <= size; len <<= 1) {
          const half = len >> 1;
          const step = size / len;
          for (let i = 0; i < size; i += len) {
            for (let k = 0; k < half; k++) {
              const idx = k * step;
              const cos = cosTable[idx];
              const sin = sinTable[idx];
              const evenIdx = i + k;
              const oddIdx = evenIdx + half;

              const tRe = real[oddIdx] * cos - imag[oddIdx] * sin;
              const tIm = real[oddIdx] * sin + imag[oddIdx] * cos;

              real[oddIdx] = real[evenIdx] - tRe;
              imag[oddIdx] = imag[evenIdx] - tIm;
              real[evenIdx] += tRe;
              imag[evenIdx] += tIm;
            }
          }
        }
      }
    };

    fftCache.set(size, fn);
    return fn;
  }

  function getMonoSamples(audioBuffer) {
    const numChannels = audioBuffer.numberOfChannels;
    const length = audioBuffer.length;
    if (numChannels === 1) {
      return audioBuffer.getChannelData(0);
    }
    const mono = new Float32Array(length);
    for (let c = 0; c < numChannels; c++) {
      const ch = audioBuffer.getChannelData(c);
      for (let i = 0; i < length; i++) {
        mono[i] += ch[i] / numChannels;
      }
    }
    return mono;
  }

  function zeroPhaseBiquad(input, sr, freq, type) {
    const w0 = (2 * Math.PI * freq) / sr;
    const cosW0 = Math.cos(w0);
    const sinW0 = Math.sin(w0);
    const alpha = sinW0 / Math.SQRT2;

    let b0, b1, b2;
    if (type === 'lowpass') {
      b0 = (1 - cosW0) / 2;
      b1 = 1 - cosW0;
      b2 = (1 - cosW0) / 2;
    } else {
      b0 = (1 + cosW0) / 2;
      b1 = -(1 + cosW0);
      b2 = (1 + cosW0) / 2;
    }
    const a0 = 1 + alpha;
    const a1 = -2 * cosW0;
    const a2 = 1 - alpha;

    const nb0 = b0 / a0, nb1 = b1 / a0, nb2 = b2 / a0;
    const na1 = a1 / a0, na2 = a2 / a0;

    const n = input.length;
    const fwd = new Float32Array(n);
    let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    for (let i = 0; i < n; i++) {
      const x0 = input[i];
      const y0 = nb0 * x0 + nb1 * x1 + nb2 * x2 - na1 * y1 - na2 * y2;
      fwd[i] = y0;
      x2 = x1; x1 = x0;
      y2 = y1; y1 = y0;
    }

    const out = new Float32Array(n);
    x1 = 0; x2 = 0; y1 = 0; y2 = 0;
    for (let i = n - 1; i >= 0; i--) {
      const x0 = fwd[i];
      const y0 = nb0 * x0 + nb1 * x1 + nb2 * x2 - na1 * y1 - na2 * y2;
      out[i] = y0;
      x2 = x1; x1 = x0;
      y2 = y1; y1 = y0;
    }
    return out;
  }

  function extractPitchContour(rawSamples, sr) {
    const fmin = 75.0;
    const fmax = 500.0;

    const hp = zeroPhaseBiquad(rawSamples, sr, 65.0, 'highpass');
    const samples = zeroPhaseBiquad(hp, sr, 950.0, 'lowpass');

    const winLen = Math.max(512, Math.round(sr * 0.0464));
    const hopLen = Math.max(128, Math.round(sr * 0.0058));
    const halfWin = winLen >> 1;

    let fftSize = 1024;
    while (fftSize < winLen * 2) fftSize <<= 1;
    const fft = getFFT(fftSize);

    const minTau = Math.max(2, Math.floor(sr / fmax));
    const maxTau = Math.min(winLen - 4, Math.floor(sr / fmin));
    const numFrames = Math.max(1, Math.ceil(samples.length / hopLen));

    const frameRms = new Float32Array(numFrames);
    let maxRms = 0;
    for (let m = 0; m < numFrames; m++) {
      const center = m * hopLen;
      const start = center - halfWin;
      let sumSq = 0;
      for (let i = 0; i < winLen; i++) {
        const idx = start + i;
        const v = (idx >= 0 && idx < samples.length) ? samples[idx] : 0;
        sumSq += v * v;
      }
      const rms = Math.sqrt(sumSq / winLen);
      frameRms[m] = rms;
      if (rms > maxRms) maxRms = rms;
    }

    const sortedRms = Float32Array.from(frameRms).sort();
    const p15 = sortedRms[Math.floor(numFrames * 0.15)] || 0;
    const noiseFloor = Math.min(Math.max(p15, 1e-5), maxRms * 0.12);
    const energyGate = Math.max(noiseFloor * 2.0, maxRms * 0.012);

    const binsPerSemitone = 5;
    const totalSemitones = 12 * Math.log2(fmax / fmin);
    const numPitchStates = Math.ceil(totalSemitones * binsPerSemitone) + 1;
    const unvoicedState = numPitchStates;
    const totalStates = numPitchStates + 1;

    const hzToBin = (hz) => {
      const semi = 12 * Math.log2(hz / fmin);
      return Math.max(0, Math.min(numPitchStates - 1, Math.round(semi * binsPerSemitone)));
    };
    const binToHz = (bin) => fmin * Math.pow(2, bin / (12 * binsPerSemitone));

    const real = new Float32Array(fftSize);
    const imag = new Float32Array(fftSize);
    const prefixSq = new Float32Array(winLen + 1);
    const diff = new Float32Array(maxTau + 1);
    const cmndf = new Float32Array(maxTau + 1);

    const frameCandidates = new Array(numFrames);
    const frameVoicedWeight = new Float32Array(numFrames);

    for (let m = 0; m < numFrames; m++) {
      if (frameRms[m] < energyGate) {
        frameCandidates[m] = [];
        frameVoicedWeight[m] = 0;
        continue;
      }

      const center = m * hopLen;
      const start = center - halfWin;

      prefixSq[0] = 0;
      for (let i = 0; i < winLen; i++) {
        const idx = start + i;
        const v = (idx >= 0 && idx < samples.length) ? samples[idx] : 0;
        real[i] = v;
        imag[i] = 0;
        prefixSq[i + 1] = prefixSq[i] + v * v;
      }
      for (let i = winLen; i < fftSize; i++) {
        real[i] = 0;
        imag[i] = 0;
      }

      fft.transform(real, imag);
      for (let k = 0; k < fftSize; k++) {
        real[k] = real[k] * real[k] + imag[k] * imag[k];
        imag[k] = 0;
      }
      fft.transform(real, imag);

      const invN = 1.0 / fftSize;
      const totalE = prefixSq[winLen];
      diff[0] = 0;
      for (let tau = 1; tau <= maxTau; tau++) {
        const e1 = prefixSq[winLen - tau];
        const e2 = totalE - prefixSq[tau];
        const r = real[tau] * invN;
        const d = e1 + e2 - 2.0 * r;
        diff[tau] = d > 0 ? d : 0;
      }

      cmndf[0] = 1.0;
      let runSum = 0;
      for (let tau = 1; tau <= maxTau; tau++) {
        runSum += diff[tau];
        cmndf[tau] = runSum > 0 ? (diff[tau] * tau) / runSum : 1.0;
      }

      const cands = [];
      let bestMinVal = 1.0;

      for (let tau = minTau; tau <= maxTau; tau++) {
        const v = cmndf[tau];
        if (v < bestMinVal) bestMinVal = v;

        if (v < 0.45 && v < cmndf[tau - 1] && v <= cmndf[tau + 1]) {
          let refinedTau = tau;
          const y0 = cmndf[tau - 1];
          const y1 = v;
          const y2 = cmndf[tau + 1];
          const denom = 2.0 * (y0 - 2.0 * y1 + y2);
          if (Math.abs(denom) > 1e-12) {
            const delta = (y0 - y2) / denom;
            if (Math.abs(delta) < 1.0) refinedTau = tau + delta;
          }

          const hz = sr / refinedTau;
          if (hz >= fmin && hz <= fmax) {
            const clarity = Math.max(0.001, 1.0 - v / 0.48);
            const weight = Math.pow(clarity, 2.5);
            cands.push({ hz, bin: hzToBin(hz), weight, dip: v });
          }
        }
      }

      if (cands.length === 0 || bestMinVal > 0.44) {
        frameCandidates[m] = [];
        frameVoicedWeight[m] = 0;
      } else {
        let sumW = 0;
        for (const c of cands) sumW += c.weight;
        for (const c of cands) c.prob = c.weight / sumW;

        const periodicity = Math.max(0, Math.min(1, (0.48 - bestMinVal) / 0.36));
        const voicedProb = Math.min(0.98, 0.15 + 0.83 * periodicity);
        frameCandidates[m] = cands;
        frameVoicedWeight[m] = voicedProb;
      }
    }

    const backptr = new Int16Array(numFrames * totalStates);
    let prevLogProb = new Float32Array(totalStates);
    let currLogProb = new Float32Array(totalStates);

    const logSwitchToUnvoiced = Math.log(0.025);
    const logSwitchToVoiced = Math.log(0.02);
    const logStayUnvoiced = Math.log(0.975);
    const logStayVoicedBase = Math.log(0.98);

    for (let s = 0; s < totalStates; s++) prevLogProb[s] = -1e9;
    prevLogProb[unvoicedState] = Math.log(0.5);
    if (frameVoicedWeight[0] > 0) {
      for (const c of frameCandidates[0]) {
        prevLogProb[c.bin] = Math.log(frameVoicedWeight[0] * c.prob + 1e-12);
      }
    }

    const maxStepBins = Math.round(4.5 * binsPerSemitone);

    for (let m = 1; m < numFrames; m++) {
      const vp = frameVoicedWeight[m];
      const up = 1.0 - vp;

      let bestUnvoicedScore = prevLogProb[unvoicedState] + logStayUnvoiced;
      let bestUnvoicedPrev = unvoicedState;
      for (let s = 0; s < numPitchStates; s++) {
        const sc = prevLogProb[s] + logSwitchToUnvoiced;
        if (sc > bestUnvoicedScore) {
          bestUnvoicedScore = sc;
          bestUnvoicedPrev = s;
        }
      }
      currLogProb[unvoicedState] = bestUnvoicedScore + Math.log(Math.max(up, 1e-6));
      backptr[m * totalStates + unvoicedState] = bestUnvoicedPrev;

      for (let s = 0; s < numPitchStates; s++) {
        currLogProb[s] = -1e9;
        backptr[m * totalStates + s] = unvoicedState;
      }

      if (vp > 0) {
        const obsLog = new Float32Array(numPitchStates).fill(-1e9);
        for (const c of frameCandidates[m]) {
          const base = Math.log(vp * c.prob + 1e-12);
          if (base > obsLog[c.bin]) obsLog[c.bin] = base;
          if (c.bin > 0 && base - 0.6 > obsLog[c.bin - 1]) obsLog[c.bin - 1] = base - 0.6;
          if (c.bin + 1 < numPitchStates && base - 0.6 > obsLog[c.bin + 1]) obsLog[c.bin + 1] = base - 0.6;
        }

        const fromUnvoicedBase = prevLogProb[unvoicedState] + logSwitchToVoiced;

        for (let s = 0; s < numPitchStates; s++) {
          if (obsLog[s] <= -1e8) continue;

          let bestScore = fromUnvoicedBase;
          let bestPrev = unvoicedState;

          const lo = Math.max(0, s - maxStepBins);
          const hi = Math.min(numPitchStates - 1, s + maxStepBins);
          for (let ps = lo; ps <= hi; ps++) {
            if (prevLogProb[ps] <= -1e8) continue;
            const dSemi = Math.abs(s - ps) / binsPerSemitone;
            const trans = logStayVoicedBase - 0.85 * dSemi;
            const sc = prevLogProb[ps] + trans;
            if (sc > bestScore) {
              bestScore = sc;
              bestPrev = ps;
            }
          }

          currLogProb[s] = bestScore + obsLog[s];
          backptr[m * totalStates + s] = bestPrev;
        }
      }

      const tmp = prevLogProb;
      prevLogProb = currLogProb;
      currLogProb = tmp;
    }

    let bestFinalState = unvoicedState;
    let bestFinalScore = prevLogProb[unvoicedState];
    for (let s = 0; s < numPitchStates; s++) {
      if (prevLogProb[s] > bestFinalScore) {
        bestFinalScore = prevLogProb[s];
        bestFinalState = s;
      }
    }

    const states = new Int16Array(numFrames);
    states[numFrames - 1] = bestFinalState;
    for (let m = numFrames - 1; m > 0; m--) {
      states[m - 1] = backptr[m * totalStates + states[m]];
    }

    const points = [];
    for (let m = 0; m < numFrames; m++) {
      const st = states[m];
      let hz = null;
      if (st !== unvoicedState && frameCandidates[m].length > 0) {
        const targetHz = binToHz(st);
        let bestCand = frameCandidates[m][0];
        let bestDist = Math.abs(Math.log2(bestCand.hz / targetHz));
        for (let i = 1; i < frameCandidates[m].length; i++) {
          const dist = Math.abs(Math.log2(frameCandidates[m][i].hz / targetHz));
          if (dist < bestDist) {
            bestDist = dist;
            bestCand = frameCandidates[m][i];
          }
        }
        hz = bestDist < 0.25 ? bestCand.hz : targetHz;
      }

      points.push({
        t: Number(((m * hopLen) / sr).toFixed(3)),
        hz: hz !== null ? Number(hz.toFixed(1)) : null
      });
    }

    return points;
  }

  function generateSpectrogramDataUrl(samples, sr) {
    const fftSize = sr > 32000 ? 4096 : 2048;
    const hopSize = fftSize >> 2;
    const halfFft = fftSize >> 1;
    const { hann, transform } = getFFT(fftSize);

    const maxFreq = 8000;
    const numBins = Math.min(halfFft, Math.max(16, Math.floor((maxFreq * fftSize) / sr)));
    const numFrames = Math.max(1, Math.ceil(samples.length / hopSize));

    const magnitudes = new Float32Array(numFrames * numBins);
    const real = new Float32Array(fftSize);
    const imag = new Float32Array(fftSize);
    let maxMag = 1e-12;

    for (let m = 0; m < numFrames; m++) {
      const center = m * hopSize;
      const start = center - halfFft;
      for (let i = 0; i < fftSize; i++) {
        const idx = start + i;
        const sample = (idx >= 0 && idx < samples.length) ? samples[idx] : 0;
        real[i] = sample * hann[i];
        imag[i] = 0;
      }

      transform(real, imag);

      const offset = m * numBins;
      for (let k = 0; k < numBins; k++) {
        const re = real[k];
        const im = imag[k];
        const mag = Math.sqrt(re * re + im * im);
        magnitudes[offset + k] = mag;
        if (mag > maxMag) maxMag = mag;
      }
    }

    const offCanvas = document.createElement('canvas');
    offCanvas.width = numFrames;
    offCanvas.height = numBins;
    const ctx = offCanvas.getContext('2d');
    const imgData = ctx.createImageData(numFrames, numBins);
    const pixels = imgData.data;

    const topDb = 80.0;
    const invMaxMag = 1.0 / maxMag;

    for (let m = 0; m < numFrames; m++) {
      const frameOffset = m * numBins;
      for (let k = 0; k < numBins; k++) {
        const ratio = Math.max(magnitudes[frameOffset + k] * invMaxMag, 1e-4);
        const db = 20.0 * Math.log10(ratio);
        const norm = Math.max(0, Math.min(1, (db + topDb) / topDb));
        const lutIdx = Math.round(norm * 255) * 3;

        const y = numBins - 1 - k;
        const pIdx = (y * numFrames + m) * 4;
        pixels[pIdx]     = MAGMA_LUT[lutIdx];
        pixels[pIdx + 1] = MAGMA_LUT[lutIdx + 1];
        pixels[pIdx + 2] = MAGMA_LUT[lutIdx + 2];
        pixels[pIdx + 3] = 255;
      }
    }

    ctx.putImageData(imgData, 0, 0);
    return offCanvas.toDataURL('image/png');
  }

  async function analyzeAudioBlob(blob) {
    const arrayBuffer = await blob.arrayBuffer();
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioCtx();
    try {
      const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
      const samples = getMonoSamples(audioBuffer);
      const sr = audioBuffer.sampleRate;

      const contour = extractPitchContour(samples, sr);
      const spectrogram = generateSpectrogramDataUrl(samples, sr);
      return { version: ANALYSIS_VERSION, contour, spectrogram };
    } finally {
      await audioCtx.close();
    }
  }

  // ==========================================
  // 2. INDEXEDDB STORAGE LAYER (SAFE CLONING + COMMIT WAIT)
  // ==========================================
  const DB_NAME = 'PitchPracticeDBv1';
  const DB_VERSION = 1;
  let db = null;
  let storageUnavailableReason = null;
  const memStore = { folders: new Map(), audios: new Map() };

  function showStorageWarning(msg) {
    const banner = document.getElementById('storageBanner');
    banner.textContent = msg;
    banner.classList.add('visible');
  }

  // Strip non-cloneable runtime properties (like cached DOM Image elements) before IndexedDB put()
  function sanitizeForDB(storeName, item) {
    if (storeName === 'folders') {
      return {
        id: item.id,
        name: item.name,
        parentId: item.parentId || null,
        order: item.order ?? 0,
        collapsed: !!item.collapsed
      };
    }
    const clean = {
      id: item.id,
      name: item.name,
      folderId: item.folderId || null,
      order: item.order ?? 0,
      mimeType: item.mimeType || 'audio/mpeg',
      analysisData: item.analysisData ? {
        version: item.analysisData.version,
        contour: item.analysisData.contour,
        spectrogram: item.analysisData.spectrogram
      } : null
    };
    if (item.arrayBuffer) clean.arrayBuffer = item.arrayBuffer;
    if (item.blob instanceof Blob) clean.blob = item.blob;
    return clean;
  }

function openDB() {
  return new Promise((resolve) => {
    try {
      if (!window.indexedDB) {
        storageUnavailableReason = 'IndexedDB is not supported in this browser context. Use Export to save a backup.';
        showStorageWarning(storageUnavailableReason);
        resolve(null);
        return;
      }

      // Omitting the version opens any existing DB at its current version without a VersionError
      const req = indexedDB.open(DB_NAME);

      req.onupgradeneeded = (e) => {
        const database = e.target.result;
        if (!database.objectStoreNames.contains('folders')) {
          database.createObjectStore('folders', { keyPath: 'id' });
        }
        if (!database.objectStoreNames.contains('audios')) {
          database.createObjectStore('audios', { keyPath: 'id' });
        }
      };

      req.onsuccess = (e) => {
        const database = e.target.result;
        const hasStores =
          database.objectStoreNames.contains('folders') &&
          database.objectStoreNames.contains('audios');

        // If an older prototype bumped the version without creating these stores, upgrade by +1
        if (!hasStores) {
          const nextVersion = database.version + 1;
          database.close();
          const upgradeReq = indexedDB.open(DB_NAME, nextVersion);
          upgradeReq.onupgradeneeded = (ev) => {
            const upgradedDb = ev.target.result;
            if (!upgradedDb.objectStoreNames.contains('folders')) {
              upgradedDb.createObjectStore('folders', { keyPath: 'id' });
            }
            if (!upgradedDb.objectStoreNames.contains('audios')) {
              upgradedDb.createObjectStore('audios', { keyPath: 'id' });
            }
          };
          upgradeReq.onsuccess = (ev) => {
            db = ev.target.result;
            db.onversionchange = () => { db.close(); db = null; };
            resolve(db);
          };
          upgradeReq.onerror = (ev) => {
            showStorageWarning(`Storage upgrade failed (${ev.target?.error?.message || 'Error'}).`);
            resolve(null);
          };
          return;
        }

        db = database;
        db.onversionchange = () => {
          db.close();
          db = null;
        };
        resolve(db);
      };

      req.onerror = (e) => {
        const errMsg = e.target && e.target.error ? e.target.error.message : 'Access denied';
        storageUnavailableReason = `Persistent storage blocked (${errMsg}). Use Export to save your library.`;
        showStorageWarning(storageUnavailableReason);
        resolve(null);
      };
    } catch (err) {
      storageUnavailableReason = `Persistent storage blocked (${err.message}). Use Export to save your library.`;
      showStorageWarning(storageUnavailableReason);
      resolve(null);
    }
  });
}
  function dbGetAll(storeName) {
    if (!db) {
      return Promise.resolve(Array.from(memStore[storeName].values()));
    }
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).getAll();
        req.onsuccess = () => {
          const rows = req.result || [];
          memStore[storeName].clear();
          rows.forEach(r => memStore[storeName].set(r.id, r));
          resolve(rows);
        };
        req.onerror = () => resolve(Array.from(memStore[storeName].values()));
      } catch (err) {
        console.error('dbGetAll error:', err);
        resolve(Array.from(memStore[storeName].values()));
      }
    });
  }

  function dbPut(storeName, item) {
    const cleanItem = sanitizeForDB(storeName, item);
    memStore[storeName].set(cleanItem.id, cleanItem);
    if (!db) {
      return Promise.resolve();
    }
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).put(cleanItem);
        tx.oncomplete = () => resolve();
        tx.onerror = (e) => {
          console.error('dbPut transaction error:', e.target.error);
          showStorageWarning(`Failed to save item to IndexedDB: ${e.target.error?.message || 'Storage quota or write error'}`);
          resolve();
        };
        tx.onabort = (e) => {
          console.error('dbPut transaction aborted:', e.target.error);
          resolve();
        };
      } catch (err) {
        console.error('dbPut exception:', err);
        showStorageWarning(`Failed to save item: ${err.message}`);
        resolve();
      }
    });
  }

  function dbDelete(storeName, id) {
    memStore[storeName].delete(id);
    if (!db) {
      return Promise.resolve();
    }
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
        tx.onabort = () => resolve();
      } catch (err) {
        console.error('dbDelete exception:', err);
        resolve();
      }
    });
  }

  function genId(prefix) {
    return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
  }

  let pendingNewFolderParentId = undefined;
  let editingItemId = null;

  let draggedType = null;
  let draggedId = null;

  const mainCard = document.getElementById('mainCard');

  const treeContainer = document.getElementById('treeContainer');
  const fileInput = document.getElementById('fileInput');
  const importInput = document.getElementById('importInput');

  async function refreshLibrary() {
    folders = await dbGetAll('folders');
    audios = await dbGetAll('audios');
    renderTree();
  }

  function isDescendant(potentialDescendantId, folderId) {
    let curr = folders.find(f => f.id === potentialDescendantId);
    while (curr) {
      if (curr.id === folderId) return true;
      curr = folders.find(f => f.id === curr.parentId);
    }
    return false;
  }

  function clearDragClasses() {
    sidebar.classList.remove('drag-over-root');
    mainCard.classList.remove('drag-over-card');
    document.querySelectorAll('.tree-row').forEach(el => {
      el.classList.remove('drag-inside', 'drag-before', 'drag-after');
    });
  }

  function createInlineFolderInputRow(parentId, depth) {
    const row = document.createElement('div');
    row.className = 'tree-row folder-row';
    row.style.marginLeft = `${depth * 14}px`;

    const left = document.createElement('div');
    left.className = 'row-left';
    left.innerHTML = `<span class="caret">▼</span><span>📁</span>`;

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'inline-input';
    input.placeholder = parentId ? 'Subfolder name...' : 'Folder name...';

    let committed = false;
    const commit = async () => {
      if (committed) return;
      committed = true;
      const val = input.value.trim();
      pendingNewFolderParentId = undefined;
      if (val) {
        const siblings = folders.filter(f => (f.parentId || null) === parentId);
        const maxOrder = siblings.reduce((m, f) => Math.max(m, f.order ?? 0), 0);
        await dbPut('folders', {
          id: genId('fld'),
          name: val,
          parentId: parentId,
          order: maxOrder + 10,
          collapsed: false
        });
      }
      await refreshLibrary();
    };

    input.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Enter') commit();
      if (e.key === 'Escape') {
        committed = true;
        pendingNewFolderParentId = undefined;
        renderTree();
      }
    });
    input.addEventListener('blur', commit);
    input.addEventListener('click', (e) => e.stopPropagation());

    left.appendChild(input);
    row.appendChild(left);
    setTimeout(() => input.focus(), 0);
    return row;
  }

  function renderTree() {

    if (folders.length === 0 && audios.length === 0 && pendingNewFolderParentId === undefined) {

      return;

      const levelFolders = folders
        .filter(f => (f.parentId || null) === parentId)

      const levelAudios = audios
        .filter(a => (a.folderId || null) === parentId)

            const val = input.value.trim();

              await dbPut('folders', folder);

            await refreshLibrary();
          };
          input.addEventListener('keydown', (e) => {
            e.stopPropagation();
            if (e.key === 'Enter') saveRename();

              saved = true;
              editingItemId = null;
              renderTree();
            }
          });
          input.addEventListener('blur', saveRename);
          input.addEventListener('click', (e) => e.stopPropagation());
          row.querySelector('.row-left').appendChild(input);
          setTimeout(() => { input.focus(); input.select(); }, 0);
        } else {
          row.innerHTML = `
            <div class="row-left">
              <span class="caret">${folder.collapsed ? '▶' : '▼'}</span>
              <span>📁</span>
              <span class="row-label" title="${folder.name}">${folder.name}</span>
            </div>
            <div class="row-actions">
              <button type="button" class="icon-btn" data-act="sub" title="New Subfolder">+Sub</button>

        }

        row.addEventListener('click', async (e) => {

          const act = e.target.dataset.act;
          if (act === 'sub') {
            e.stopPropagation();
            folder.collapsed = false;
            await dbPut('folders', folder);
            pendingNewFolderParentId = folder.id;
            renderTree();
            return;
          }
          if (act === 'ren') {
            e.stopPropagation();
            editingItemId = folder.id;
            renderTree();
            return;
          }
          if (act === 'del') {
            e.stopPropagation();
            await deleteFolderRecursive(folder.id);
            return;
          }

          folder.collapsed = !folder.collapsed;
          await dbPut('folders', folder);
          renderTree();
        });

        row.addEventListener('dragstart', (e) => {
          e.stopPropagation();
          draggedType = 'folder';
          draggedId = folder.id;
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', folder.id);
        });

        row.addEventListener('dragend', () => {
          draggedType = null;
          draggedId = null;
          clearDragClasses();
        });

        row.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.stopPropagation();
          clearDragClasses();

          if (draggedType === 'folder' && (draggedId === folder.id || isDescendant(folder.id, draggedId))) {

  // ==========================================
  // 4. FOLDER, FILE & BACKUP OPERATIONS
  // ==========================================
  function startCreateFolder(parentId = null) {
    pendingNewFolderParentId = parentId;
    renderTree();
  }

  async function deleteFolderRecursive(folderId) {
    const toDeleteFolders = [folderId];
    let idx = 0;
    while (idx < toDeleteFolders.length) {
      const currId = toDeleteFolders[idx++];
      folders.filter(f => f.parentId === currId).forEach(sub => toDeleteFolders.push(sub.id));
    }

    const audiosToDelete = audios.filter(a => toDeleteFolders.includes(a.folderId));
    for (const a of audiosToDelete) {
      await dbDelete('audios', a.id);
      if (activeAudioId === a.id) {
        activeAudioId = null;
        jpDisplay.textContent = 'Drop or select audio...';
      }
    }
    for (const fId of toDeleteFolders) {
      await dbDelete('folders', fId);
    }
    await refreshLibrary();
  }

  async function moveItemToParent(type, id, targetParentId, targetSibling, insertBefore) {
    if (type === 'folder') {
      const item = folders.find(f => f.id === id);
      if (!item) return;
      item.parentId = targetParentId;

      const siblings = folders
        .filter(f => (f.parentId || null) === targetParentId && f.id !== id)
        .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

      if (targetSibling && targetSibling.id.startsWith('fld_')) {
        const sIdx = siblings.findIndex(f => f.id === targetSibling.id);
        const insertIdx = insertBefore ? Math.max(0, sIdx) : sIdx + 1;
        siblings.splice(insertIdx, 0, item);
      } else {
        siblings.push(item);
      }

      for (let i = 0; i < siblings.length; i++) {
        siblings[i].order = (i + 1) * 10;
        await dbPut('folders', siblings[i]);
      }
    } else if (type === 'audio') {
      const item = audios.find(a => a.id === id);
      if (!item) return;
      item.folderId = targetParentId;

      const siblings = audios
        .filter(a => (a.folderId || null) === targetParentId && a.id !== id)
        .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

      if (targetSibling && targetSibling.id.startsWith('aud_')) {
        const sIdx = siblings.findIndex(a => a.id === targetSibling.id);
        const insertIdx = insertBefore ? Math.max(0, sIdx) : sIdx + 1;
        siblings.splice(insertIdx, 0, item);
      } else {
        siblings.push(item);
      }

      for (let i = 0; i < siblings.length; i++) {
        siblings[i].order = (i + 1) * 10;
        await dbPut('audios', siblings[i]);
      }
    }

    await refreshLibrary();
  }

  async function importExternalFiles(fileList, targetFolderId = null) {
    const existing = audios.filter(a => (a.folderId || null) === targetFolderId);
    let nextOrder = existing.reduce((m, a) => Math.max(m, a.order ?? 0), 0) + 10;

    let firstAdded = null;
    for (const file of Array.from(fileList)) {
      if (!file.type.startsWith('audio/') && !file.name.match(/\.(mp3|wav|m4a|ogg|webm|flac|aac|opus)$/i)) {
        continue;
      }
      const cleanName = file.name.replace(/\.[^/.]+$/, '');
      const arrayBuffer = await file.arrayBuffer();
      const record = {
        id: genId('aud'),
        name: cleanName,
        folderId: targetFolderId,
        order: nextOrder,
        arrayBuffer: arrayBuffer,
        mimeType: file.type || 'audio/mpeg',
        analysisData: null
      };
      nextOrder += 10;
      await dbPut('audios', record);
      if (!firstAdded) firstAdded = record;
    }

    await refreshLibrary();
    if (firstAdded && !activeAudioId) {
      await loadAudioFromLibrary(firstAdded);
    }
  }

  function arrayBufferToBase64(buffer) {
    const bytes = new Uint8Array(buffer);
    let binary = '';
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(binary);
  }

  function base64ToArrayBuffer(base64) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    return bytes.buffer;
  }

  async function exportLibraryBackup() {
    const allFolders = await dbGetAll('folders');
    const allAudios = await dbGetAll('audios');
    const serializedAudios = [];

    for (const a of allAudios) {
      let buf = a.arrayBuffer;
      if (!buf && a.blob instanceof Blob) {
        buf = await a.blob.arrayBuffer();
      }
      serializedAudios.push({
        id: a.id,
        name: a.name,
        folderId: a.folderId || null,
        order: a.order ?? 0,
        mimeType: a.mimeType || 'audio/mpeg',
        audioBase64: buf ? arrayBufferToBase64(buf) : null,
        analysisData: a.analysisData || null
      });
    }

    const payload = {
      exportedAt: new Date().toISOString(),
      folders: allFolders,
      audios: serializedAudios
    };

    const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `pitch-library-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  async function importLibraryBackup(file) {
    try {
      const text = await file.text();
      const payload = JSON.parse(text);
      if (Array.isArray(payload.folders)) {
        for (const f of payload.folders) {
          await dbPut('folders', f);
        }
      }
      if (Array.isArray(payload.audios)) {
        for (const a of payload.audios) {
          const record = {
            id: a.id,
            name: a.name,
            folderId: a.folderId || null,
            order: a.order ?? 0,
            mimeType: a.mimeType || 'audio/mpeg',
            arrayBuffer: a.audioBase64 ? base64ToArrayBuffer(a.audioBase64) : null,
            analysisData: a.analysisData || null
          };
          await dbPut('audios', record);
        }
      }
      await refreshLibrary();
    } catch (err) {
      alert('Invalid backup file: ' + err.message);
    }
  }

  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => e.preventDefault());

  mainCard.addEventListener('dragover', (e) => {
    e.preventDefault();
    if (!draggedType) {
      clearDragClasses();
      mainCard.classList.add('drag-over-card');
    }
  });
  mainCard.addEventListener('dragleave', (e) => {
    if (!mainCard.contains(e.relatedTarget)) {
      mainCard.classList.remove('drag-over-card');
    }
  });
  mainCard.addEventListener('drop', async (e) => {
    e.preventDefault();
    clearDragClasses();
    if (!draggedType && e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      await importExternalFiles(e.dataTransfer.files, null);
    }
  });

  sidebar.addEventListener('dragover', (e) => {
    e.preventDefault();
    clearDragClasses();
    sidebar.classList.add('drag-over-root');
  });

  sidebar.addEventListener('dragleave', (e) => {
    if (!sidebar.contains(e.relatedTarget)) {
      clearDragClasses();
    }
  });

  sidebar.addEventListener('drop', async (e) => {
    e.preventDefault();
    clearDragClasses();

    if (!draggedType && e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      await importExternalFiles(e.dataTransfer.files, null);
      return;
    }

    if (draggedType) {
      await moveItemToParent(draggedType, draggedId, null, null, false);
    }
  });

  document.getElementById('newRootFolderBtn').addEventListener('click', () => startCreateFolder(null));
  document.getElementById('uploadFilesBtn').addEventListener('click', () => fileInput.click());
  document.getElementById('exportBtn').addEventListener('click', exportLibraryBackup);
  document.getElementById('importBtn').addEventListener('click', () => importInput.click());

  fileInput.addEventListener('change', async (e) => {
    if (e.target.files && e.target.files.length > 0) {
      await importExternalFiles(e.target.files, null);
      fileInput.value = '';
    }
  });

  importInput.addEventListener('change', async (e) => {
    if (e.target.files && e.target.files.length > 0) {
      await importLibraryBackup(e.target.files[0]);
      importInput.value = '';
    }
  });

  // ==========================================
  // 5. AUDIO PLAYER, PITCH & SPECTROGRAM UI
  // ==========================================
  let mediaRecorder;
  let activeStream = null;
  let audioChunks = [];
  let pixelsPerSecond = 460 / 5;
  let currentPlaybackRate = 1.0;

  let currentNativeData = null;
  let currentUserData = null;
  let currentNativeUrl = null;
  let currentUserUrl = null;

  // Keep decoded Image objects outside audioItem so IndexedDB structured cloning never fails
  const spectrogramImgCache = new Map();

  const recordBtn = document.getElementById('recordBtn');
  const playUserBtn = document.getElementById('playUserBtn');
  const jpDisplay = document.getElementById('jpDisplay');
  const playNativeBtn = document.getElementById('playNativeBtn');
  const nativePlayer = document.getElementById('nativePlayer');
  const userPlayer = document.getElementById('userPlayer');

  document.querySelectorAll('.speed-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');

      currentPlaybackRate = parseFloat(e.target.dataset.speed);
      nativePlayer.playbackRate = currentPlaybackRate;
      userPlayer.playbackRate = currentPlaybackRate;
    });
  });

  function getBlobFromRecord(audioItem) {
    if (audioItem.blob instanceof Blob) {
      return audioItem.blob;
    }
    if (audioItem.arrayBuffer) {
      return new Blob([audioItem.arrayBuffer], { type: audioItem.mimeType || 'audio/mpeg' });
    }
    return null;
  }

  async function loadAudioFromLibrary(audioItem) {
    activeAudioId = audioItem.id;
    renderTree();

    const blob = getBlobFromRecord(audioItem);
    if (!blob) return;

    jpDisplay.textContent = audioItem.name;

    if (currentNativeUrl) {
      URL.revokeObjectURL(currentNativeUrl);
    }
    currentNativeUrl = URL.createObjectURL(blob);
    nativePlayer.src = currentNativeUrl;
    nativePlayer.playbackRate = currentPlaybackRate;

    currentUserData = null;
    const userCanvas = document.getElementById('userCanvas');
    userCanvas.width = 460;
    userCanvas.getContext('2d').clearRect(0, 0, 460, 180);
    playUserBtn.style.display = 'none';
    userPlayer.removeAttribute('src');
    userPlayer.load();

    if (audioItem.analysisData && audioItem.analysisData.version === ANALYSIS_VERSION) {
      currentNativeData = audioItem.analysisData;
      drawContour('nativeCanvas', currentNativeData);
    } else {
      jpDisplay.textContent = `Analyzing: ${audioItem.name}...`;
      try {
        const analyzed = await analyzeAudioBlob(blob);
        audioItem.analysisData = analyzed;
        await dbPut('audios', audioItem);

        if (activeAudioId === audioItem.id) {
          jpDisplay.textContent = audioItem.name;
          currentNativeData = analyzed;
          drawContour('nativeCanvas', currentNativeData);
        }
      } catch (err) {
        console.error(err);
        if (activeAudioId === audioItem.id) {
          jpDisplay.textContent = `${audioItem.name} (audio decode error)`;
        }
      }
    }
  }

  function drawContour(canvasId, data) {
    if (!data) return;

    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext('2d');
    const points = data.contour;

    const validHz = points.map(p => p.hz).filter(h => h !== null);
    const maxT = (points.length ? points[points.length - 1].t : 1.0) || 1.0;
    const exactAudioWidth = maxT * pixelsPerSecond;
    canvas.width = Math.max(460, exactAudioWidth + 20);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    function drawPitchLine() {
      if (!validHz.length) return;
      const minHz = Math.min(...validHz) * 0.9;
      const maxHz = Math.max(...validHz) * 1.1;

      ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
      ctx.shadowBlur = 4;
      ctx.shadowOffsetY = 2;

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.8;
      ctx.lineCap = 'round';
      ctx.beginPath();

      let drawing = false;
      points.forEach(p => {
        if (p.hz === null) {
          drawing = false;
          return;
        }
        const x = (p.t * pixelsPerSecond) + 10;
        const y = canvas.height - ((p.hz - minHz) / (maxHz - minHz) * (canvas.height - 30) + 15);

        if (!drawing) {
          ctx.moveTo(x, y);
          drawing = true;
        } else {
          ctx.lineTo(x, y);
        }
      });
      ctx.stroke();
      ctx.shadowColor = 'transparent';
    }

    if (data.spectrogram) {
      const cachedImg = spectrogramImgCache.get(data.spectrogram);
      if (cachedImg && cachedImg.complete) {
        ctx.drawImage(cachedImg, 10, 0, exactAudioWidth, canvas.height);
        drawPitchLine();
      } else {
        const img = new Image();
        img.onload = () => {
          spectrogramImgCache.set(data.spectrogram, img);
          ctx.drawImage(img, 10, 0, exactAudioWidth, canvas.height);
          drawPitchLine();
        };
        img.src = data.spectrogram;
      }
    } else {
      drawPitchLine();
    }
  }

  document.querySelectorAll('.canvas-wrapper').forEach(wrapper => {
    wrapper.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY || e.deltaX;

      if (e.shiftKey) {
        wrapper.scrollLeft += delta;
      } else {
        if (delta < 0) {
          pixelsPerSecond *= 1.2;
        } else if (delta > 0) {
          pixelsPerSecond /= 1.2;
        }
        pixelsPerSecond = Math.max(30, Math.min(pixelsPerSecond, 800));

        drawContour('nativeCanvas', currentNativeData);
        drawContour('userCanvas', currentUserData);
      }
    }, { passive: false });
  });

  function handleCanvasClick(e, playerElem) {
    if (!playerElem.getAttribute('src')) return;

    const rect = e.target.getBoundingClientRect();
    const clickX = e.clientX - rect.left;

    let targetTime = (clickX - 10) / pixelsPerSecond;
    if (targetTime < 0) targetTime = 0;

    playerElem.currentTime = targetTime;
    playerElem.play();
  }

  document.getElementById('nativeCanvas').addEventListener('click', (e) => handleCanvasClick(e, nativePlayer));
  document.getElementById('userCanvas').addEventListener('click', (e) => handleCanvasClick(e, userPlayer));

  playNativeBtn.addEventListener('click', () => {
    if (nativePlayer.getAttribute('src')) nativePlayer.play();
  });

  playUserBtn.addEventListener('click', () => {
    if (userPlayer.getAttribute('src')) userPlayer.play();
  });

  recordBtn.addEventListener('click', async () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      recordBtn.classList.remove('recording');
      recordBtn.textContent = '● Record';
      return;
    }

    try {
      activeStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      alert('Microphone access failed. Serve over http://localhost or HTTPS and grant microphone permission.');
      return;
    }

    mediaRecorder = new MediaRecorder(activeStream);
    audioChunks = [];

    playUserBtn.style.display = 'none';

    mediaRecorder.ondataavailable = e => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = async () => {
      if (activeStream) {
        activeStream.getTracks().forEach(t => t.stop());
        activeStream = null;
      }

      const mimeType = mediaRecorder.mimeType || 'audio/webm';
      const audioBlob = new Blob(audioChunks, { type: mimeType });

      if (currentUserUrl) {
        URL.revokeObjectURL(currentUserUrl);
      }
      currentUserUrl = URL.createObjectURL(audioBlob);
      userPlayer.src = currentUserUrl;
      userPlayer.playbackRate = currentPlaybackRate;
      playUserBtn.style.display = 'block';
      userPlayer.play();

      currentUserData = await analyzeAudioBlob(audioBlob);
      drawContour('userCanvas', currentUserData);
    };

    mediaRecorder.start();
    recordBtn.classList.add('recording');
    recordBtn.textContent = '■ Stop';
  });

  openDB().then(() => refreshLibrary());
</script>
